name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  APP_DIR: exemplo-action
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

# Todos os passos "run" executam dentro da subpasta do projeto
defaults:
  run:
    working-directory: exemplo-action

jobs:
  # 1. BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Compilar e empacotar (sem testes)
        run: ./gradlew bootJar

      - name: Preparar JAR para o Docker
        run: |
          mkdir -p dist
          JAR=$(find build/libs -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          cp "$JAR" dist/app.jar

      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ env.APP_DIR }}/dist/app.jar
          if-no-files-found: error
          retention-days: 7

  # 2. TESTES
  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Executar testes
        run: ./gradlew test

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: |
            ${{ env.APP_DIR }}/build/reports/tests/test
            ${{ env.APP_DIR }}/build/test-results/test
          retention-days: 7

  # 3. DOCKER (build + smoke test, sem publicar)
  docker:
    name: Docker (build)
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Baixar JAR gerado no build
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ${{ env.APP_DIR }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem (local)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP_DIR }}
          push: false
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (/actuator/health)
        run: |
          docker run -d --name app -p 8080:8080 app:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health; then
              echo
              echo "Aplicação saudável"
              exit 0
            fi
            sleep 2
          done
          echo "Aplicação não subiu a tempo. Logs:"
          docker logs app
          exit 1

  # 4. PUBLICAÇÃO no GHCR (apenas push na main ou tags v*)
  publish:
    name: Publicar no GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Baixar JAR gerado no build
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ${{ env.APP_DIR }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e labels da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max